name: auto-check-sources

on:
  schedule:
    # v2: 每天1次(UTC 21:00 = 北京时间凌晨5:00), 早上生效
    # 上游(iptv-org/Guovin)本身每日更新, 跟天级节奏即可; 月耗 360->60 分钟
    # 急需立即生效: Actions -> auto-check-sources -> Run workflow 手动触发
    - cron: '0 21 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装 ffmpeg (直播画质实测)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: 归集检测并生成配置
        run: python check_sources.py --gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_REPO: ${{ secrets.GITEE_REPO }}

      - name: 提交结果
        run: |
          git config user.name "auto-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "无变更, 跳过提交"
            exit 0
          fi
          git commit -m "自动检测 $(date -u +%F_%H:%M)"
          # 提交冲突自动重试: 拉最新重合基线再推(最多3次)
          for i in 1 2 3; do
            if git push; then
              echo "推送成功"
              exit 0
            fi
            echo "第${i}次推送失败, 拉取远程更新后重试..."
            git pull --rebase --autostash origin main || true
          done
          echo "重试后仍失败, 保留本地变更退出(下轮会重新生成)"
          exit 1
