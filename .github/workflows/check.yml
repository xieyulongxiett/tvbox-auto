name: auto-check-sources

on:
  schedule:
    # 每4小时一次(UTC 0/4/8/12/16/20点), 直播线路死得快需要勤换
    - cron: '0 */4 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装 ffmpeg (直播画质实测)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: 归集检测并生成配置
        run: python check_sources.py --gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_REPO: ${{ secrets.GITEE_REPO }}

      - name: 提交结果
        run: |
          git config user.name "auto-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "自动检测 $(date -u +%F)" && git push)
