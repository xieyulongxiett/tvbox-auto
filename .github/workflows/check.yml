name: auto-check-sources

on:
  schedule:
    # UTC 20:00 = 北京时间凌晨 4 点, 每天一次
    - cron: '0 20 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 归集检测并生成配置
        run: python check_sources.py --gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_REPO: ${{ secrets.GITEE_REPO }}

      - name: 提交结果
        run: |
          git config user.name "auto-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "自动检测 $(date -u +%F)" && git push)
