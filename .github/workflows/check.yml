name: auto-check-sources

# v6: 核对四件事 —— ① cron 是 UTC(北京5点=前一天21点) ② contents:write
# ③ git add -A(否则 rmtree 掉的旧 multi/mN.json 删不掉) ④ ffmpeg 兜底安装
# v7: 加一步 Unit tests —— 纯函数回归 3 秒出结果, 比跑完一轮(10分钟)才发现问题便宜得多
# v12: ffmpeg 那步加固 + job 超时 60->30 —— 2026-10-27 那轮 apt-get update 卡在
#      镜像上占了 2066 秒(34分钟), 而 job 上限 60 分钟, 于是既不失败也不结束,
#      白挂一小时。以前每次都是 0 秒跳过(镜像自带 ffprobe), 那天镜像恰好缺了。

on:
  schedule:
    # 北京时间每天 05:00 = UTC 前一天 21:00。写成 '0 5 * * *' 会在北京13点跑
    - cron: '0 21 * * *'
  workflow_dispatch:

# 同一时间只允许一轮，避免两次 run 抢着 push 造成冲突
concurrency:
  group: auto-check-sources
  cancel-in-progress: false

permissions:
  contents: write        # 新仓库默认只读，缺这行 push 会 403

jobs:
  check:
    runs-on: ubuntu-latest
    # v12: 60 -> 30。脚本本体 7~9 分钟(含多仓展开体检), 30 分钟足够;
    # 任何一步卡死最多半小时掐断, 不再出现"挂满一小时"的僵尸 run
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # v7: 纯函数回归(3秒) —— 频道匹配/广告指纹/m3u解析 改坏了先在这里挂掉,
      # 不用等十几分钟跑完一轮才发现产物不对
      - name: Unit tests (no network)
        run: python tests/test_core.py

      # v12: ffmpeg 加固。三条原则: 能跳过就跳过、装不上就限时放弃、
      # 放弃了也继续跑(脚本有降级分支: 没有 ffprobe 时只探活不测画质)。
      # 关键改动是**去掉了 apt-get update** —— 它是那 34 分钟的真正原因
      # (拉索引时镜像抽风), 而 runner 的包索引本来就是现成的。
      # v13: 静态包优先(2026-10-27 实证: ubuntu-latest 镜像里没有 ffprobe,
      # apt 装 240 秒装不上还白耗 4 分钟 —— 那一轮 report 里 133 条线路
      # 100% "未实测", 画质和存活一条都没验过)。改成从 GitHub Release 取
      # BtbN 的静态构建(约144MB), runner 在 GitHub 内网, 几秒就能下完;
      # 静态包失败才退回 apt(限时 120 秒), 两条路都不通就降级跑, 照样出配置。
      - name: Ensure ffmpeg
        run: |
          if command -v ffprobe >/dev/null 2>&1; then
            echo "ffprobe 已在镜像里: $(ffprobe -version 2>&1 | head -1)"
            exit 0
          fi
          echo "::warning::runner 上没有 ffprobe, 取静态包(约144MB)"
          URL="https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n9.0-latest-linux64-gpl-9.0.tar.xz"
          if curl -fsSL --retry 1 --max-time 180 -o /tmp/ff.tar.xz "$URL" \
             && mkdir -p /tmp/ffx \
             && tar -xJf /tmp/ff.tar.xz -C /tmp/ffx; then
            # 不写死包内路径: BtbN 每个版本顶层目录名都带版本号, 用 find 找更抗改名
            P=$(find /tmp/ffx -type f -name ffprobe | head -1)
            F=$(find /tmp/ffx -type f -name ffmpeg | head -1)
            if [ -n "$P" ] && [ -n "$F" ]; then
              sudo install -m 0755 "$F" "$P" /usr/local/bin/
              echo "静态包就绪: $(ffprobe -version 2>&1 | head -1)"
              exit 0
            fi
            echo "::warning::解压后没找到 ffprobe/ffmpeg"
          else
            echo "::warning::静态包下载/解压失败 —— 本机实测过该地址只有 26KB/s,"
            echo "::warning::runner 在 GitHub 内网通常几秒下完; 慢就按失败处理, 别硬等"
          fi
          echo "::warning::退回 apt(限时 120 秒)"
          timeout 120 sudo apt-get install -y -qq \
            -o Acquire::http::Timeout=15 \
            -o Acquire::https::Timeout=15 \
            -o Acquire::Retries=1 \
            ffmpeg || true
          if command -v ffprobe >/dev/null 2>&1; then
            echo "apt 就绪: $(ffprobe -version 2>&1 | head -1)"
          else
            echo "::warning::仍无 ffprobe —— 本轮降级为只探活不测画质(不影响出配置)"
          fi

      - name: Install optional fallback
        run: pip install --quiet imageio-ffmpeg || true

      # v13: 探测链自检。上一步"装上了没"和"装上能不能用"是两件事 ——
      # 加这一步, 日志里直接出现分辨率数字就说明深探是真的, 一片 warning
      # 就说明这轮又白测。3 秒成本, 换掉一整轮 20 分钟的瞎猜。
      - name: Probe selftest
        run: |
          if ! command -v ffprobe >/dev/null 2>&1; then
            echo "::warning::无 ffprobe, 跳过自检(本轮按未实测记账)"
            exit 0
          fi
          ffprobe -v error -rw_timeout 8000000 \
            -select_streams v:0 -show_entries stream=width,height \
            -of csv=p=0 "https://xykt-fix.github.io/Y77.m3u8" \
            || echo "::warning::自检取流失败(可能是该线路本身不稳, 不代表脚本失败)"

      - name: Run checker
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          # 如需同步到 Gitee，在仓库 Secrets 里配这两个，不配会自动跳过
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_REPO: ${{ secrets.GITEE_REPO }}
        run: python check_sources.py --gitee

      - name: Commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # -A 很重要：write_multi_files 会 rmtree 旧的 multi/，不加 -A 旧文件删不掉
          git add -A
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "auto update $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
