name: auto-check-sources

# v6: 核对四件事 —— ① cron 是 UTC(北京5点=前一天21点) ② contents:write
# ③ git add -A(否则 rmtree 掉的旧 multi/mN.json 删不掉) ④ ffmpeg 兜底安装
# v7: 加一步 Unit tests —— 纯函数回归 3 秒出结果, 比跑完一轮(10分钟)才发现问题便宜得多

on:
  schedule:
    # 北京时间每天 05:00 = UTC 前一天 21:00。写成 '0 5 * * *' 会在北京13点跑
    - cron: '0 21 * * *'
  workflow_dispatch:

# 同一时间只允许一轮，避免两次 run 抢着 push 造成冲突
concurrency:
  group: auto-check-sources
  cancel-in-progress: false

permissions:
  contents: write        # 新仓库默认只读，缺这行 push 会 403

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # v7: 纯函数回归(3秒) —— 频道匹配/广告指纹/m3u解析 改坏了先在这里挂掉,
      # 不用等十几分钟跑完一轮才发现产物不对
      - name: Unit tests (no network)
        run: python tests/test_core.py

      # ubuntu-latest 自带 ffmpeg，这里兜底：万一镜像变了也不会全盘测不出分辨率
      - name: Ensure ffmpeg
        run: |
          command -v ffprobe >/dev/null 2>&1 || {
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          }
          ffprobe -version | head -1

      - name: Install optional fallback
        run: pip install --quiet imageio-ffmpeg || true

      - name: Run checker
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          # 如需同步到 Gitee，在仓库 Secrets 里配这两个，不配会自动跳过
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_REPO: ${{ secrets.GITEE_REPO }}
        run: python check_sources.py --gitee

      - name: Commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # -A 很重要：write_multi_files 会 rmtree 旧的 multi/，不加 -A 旧文件删不掉
          git add -A
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "auto update $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
